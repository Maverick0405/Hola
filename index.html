<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050916">
  <meta name="description" content="Un pequeño jardín de flores amarillas, solo para ti.">
  <title>Flores para ti</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23081d19'/%3E%3Ctext x='3' y='25' font-size='25'%3E🌼%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="flowers.js" defer></script>
</head>
<body>
  <div id="night-sky" aria-hidden="true"></div>
  <main>
    <section class="gift" aria-labelledby="title">
      <div class="intro"><h1 id="title">Te adoro<br><em>muchisimo</em></h1></div>
      <div class="garden" role="img" aria-label="Un ramo de siete flores amarillas que crecen y se abren suavemente"><div class="halo"></div><div class="bouquet" id="bouquet"></div><div class="ground"></div></div>
      <div class="message"><p>Se que no es lo mismo,<br>pero tenia que darte algo</p><button id="replay" type="button"><span aria-hidden="true">↻</span> Volver a florecer</button><p class="hint">Mantén pulsado y acaricia las flores con luz.</p></div>
    </section>
    <footer>FELIZ DÍA DE LAS FLORES AMARILLAS <span aria-hidden="true">♡</span></footer>
  </main>
  <div id="lights" aria-hidden="true"></div>
  <noscript><p class="no-js">Estas flores necesitan JavaScript para abrirse. Actívalo y vuelve a visitar tu jardín.</p></noscript>
</body>
</html>
